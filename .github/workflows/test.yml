name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  numpy-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[test]"
      - run: python -c "import hmeans; print(hmeans.__version__)"
      - run: pytest -q tests -k "not torch"
  torch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[test]"
      - run: pytest -q tests
