[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hmeans"
dynamic = ["version"]
description = "h-means: mini-batch k-means (e-means) with a hierarchical warm start and Hartigan assignment; scikit-learn style API on CPU, Apple MPS or CUDA"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["k-means", "clustering", "mini-batch", "e-means", "hartigan", "vector quantization"]
urls = { Homepage = "https://github.com/heldernoid/hmeans", Site = "https://h-means.github.io/" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
sklearn = ["scikit-learn>=1.3"]
experiments = ["torch>=2.1", "scikit-learn", "scipy", "matplotlib", "pandas", "h5py", "faiss-cpu", "psutil", "tqdm"]
test = ["pytest", "scikit-learn"]

[tool.setuptools]
packages = ["hmeans"]

# Version from git: a tag v1.2.3 gives 1.2.3; the N-th commit after it gives 1.2.4.devN+g<hash>.
[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "node-and-date"
fallback_version = "0.0.0"
